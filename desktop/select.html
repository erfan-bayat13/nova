<!doctype html>
<!-- "Look at area": a frozen still of the screen with a crosshair. Drag a rectangle, release to send it.
     Esc, a right click, or a tiny drag cancels. The picture was taken BEFORE this window opened, so the
     overlay is never part of what the model sees. Talks to desktop/main.cjs through select-preload.cjs. -->
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; cursor: crosshair; user-select: none; -webkit-user-select: none; }
  #shot { position: fixed; inset: 0; width: 100%; height: 100%; opacity: 0; transition: opacity 80ms; pointer-events: none; }
  #box { position: fixed; display: none; box-sizing: border-box; border: 1px solid rgba(255,255,255,.95);
         box-shadow: 0 0 0 100vmax rgba(0,0,0,.42); pointer-events: none; }
  #hint { position: fixed; left: 50%; top: 18px; transform: translateX(-50%); padding: 6px 12px; border-radius: 999px;
          font: 500 12px -apple-system, BlinkMacSystemFont, sans-serif; color: rgba(255,255,255,.92);
          background: rgba(30,30,32,.72); backdrop-filter: blur(12px); pointer-events: none; }
</style>
<img id="shot" alt="">
<div id="box"></div>
<div id="hint">Drag around what to look at · Esc to cancel</div>
<script>
  const shot = document.getElementById('shot'), box = document.getElementById('box'), hint = document.getElementById('hint');
  let a = null, b = null;
  const rect = () => ({ x: Math.min(a.x, b.x), y: Math.min(a.y, b.y), w: Math.abs(a.x - b.x), h: Math.abs(a.y - b.y) });
  function draw() {
    if (!a || !b) return;
    const r = rect();
    Object.assign(box.style, { display: 'block', left: r.x + 'px', top: r.y + 'px', width: r.w + 'px', height: r.h + 'px' });
  }
  window.areaPicker.onInit(({ src }) => {
    shot.onload = () => { shot.style.opacity = 1; window.areaPicker.ready(); };
    shot.src = src;
  });
  addEventListener('mousedown', (e) => {
    if (e.button !== 0) return window.areaPicker.done(null); // right click cancels
    a = b = { x: e.clientX, y: e.clientY };
    hint.style.display = 'none';
  });
  addEventListener('mousemove', (e) => { if (a) { b = { x: e.clientX, y: e.clientY }; draw(); } });
  addEventListener('mouseup', () => {
    if (!a) return window.areaPicker.done(null);
    window.areaPicker.done(rect());
  });
  addEventListener('keydown', (e) => { if (e.key === 'Escape') window.areaPicker.done(null); });
</script>
