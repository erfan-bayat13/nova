<!doctype html>
<meta charset="utf-8">
<title>Camera</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  .card { position: absolute; inset: 4px; border-radius: 16px; overflow: hidden; background: #000;
          box-shadow: 0 0 0 1px rgba(255,255,255,.14), 0 8px 24px rgba(0,0,0,.45); }
  video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); display: block; } /* mirrored, like a mirror */
  .dot { position: absolute; top: 10px; left: 10px; width: 8px; height: 8px; border-radius: 50%; background: #ff453a;
         animation: p 1.2s ease-in-out infinite; }
  @keyframes p { 50% { opacity: .35; } }
</style>
<div class="card"><video id="v" muted playsinline autoplay></video><div class="dot"></div></div>
<script>
  navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 640 }, height: { ideal: 480 } }, audio: false })
    .then((s) => { document.getElementById('v').srcObject = s; })
    .catch((e) => console.log('preview camera failed:', e.name));
</script>
