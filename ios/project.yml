name: Nova
options:
  bundleIdPrefix: dev.erfan
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    CLANG_CXX_LIBRARY: libc++
    DEVELOPMENT_TEAM: ""   # set your team id, or pick it in Xcode > Signing
targets:
  Nova:
    type: application
    platform: iOS
    sources: [Nova]
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: Nova/Engine/Nova-Bridging-Header.h
        OTHER_LDFLAGS: ["-lc++"]
    dependencies:
      - framework: Frameworks/llama.xcframework
        embed: true
        link: true
      - sdk: Metal.framework
      - sdk: Accelerate.framework
      - sdk: Foundation.framework
    entitlements:
      path: Nova/Nova.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
    info:
      path: Nova/Info.plist
      properties:
        CFBundleDisplayName: Nova
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: Nova listens to you and answers out loud, all on this phone.
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
